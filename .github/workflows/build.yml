name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Gradle Wrapper
        run: |
          # Find gradlew file anywhere in the project tree
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew wrapper missing from repository! Generating a new wrapper..."
            gradle wrapper
            GRADLEW_PATH="./gradlew"
          fi

          echo "Found gradlew at: $GRADLEW_PATH"
          sed -i 's/\r$//' "$GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          # Navigate to where gradlew lives and execute assembleDebug
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: ignore
